[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r3x-bugbounty"
version = "1.0.0"
description = "Autonomous Multi-Agent AI Cybersecurity & Bug Bounty Framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "r3xdec", email = "research@r3xdec.local" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "prompt_toolkit>=3.0.40",
    "jinja2>=3.1.3",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
r3x = "r3x.cli.main:entry_point"

[tool.setuptools.packages.find]
where = ["."]
include = ["r3x*"]
