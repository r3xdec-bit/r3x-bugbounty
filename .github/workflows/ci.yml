name: R3X-BugBounty CI Pipeline

on:
  push:
    branches: [ master, v2-evolution ]
  pull_request:
    branches: [ master, v2-evolution ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq nmap curl tar unzip

    - name: Install Project & Dev Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff bandit pytest pytest-asyncio pytest-cov httpx
        pip install -e .

    - name: Run Code Linter (Ruff)
      run: |
        ruff check r3x/ tests/

    - name: Run Static Security Audit (Bandit)
      run: |
        bandit -r r3x/

    - name: Run Automated Test Suite (Pytest)
      run: |
        pytest -v --cov=r3x tests/
